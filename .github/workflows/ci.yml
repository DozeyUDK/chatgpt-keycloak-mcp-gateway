name: tests-and-safety
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/security_check.py
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
